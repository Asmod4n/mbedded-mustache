name: macos

on:
  push:
    paths:
      - "include/**"
      - "test/**"
      - "CMakeLists.txt"
      - "refs/mustache-spec/*.json"
      - ".github/workflows/macos.yml"
      - "!test/arm_none_eabi.cpp"
  pull_request:
    paths:
      - "include/**"
      - "test/**"
      - "CMakeLists.txt"
      - "refs/mustache-spec/*.json"
      - ".github/workflows/macos.yml"
      - "!test/arm_none_eabi.cpp"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: arm64 macOS Apple clang C++23 and Homebrew g++ C++26 reflection
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - run: echo "WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ env.WEEK }}
          restore-keys: brew-
      - run: brew install cmake ninja gcc googletest simdjson
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - run: echo "CXX=$(ls "$(brew --prefix gcc)"/bin/g++-[0-9]* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - run: echo "CC=$(ls "$(brew --prefix gcc)"/bin/gcc-[0-9]* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch v1.17.0 https://github.com/google/googletest.git "$RUNNER_TEMP/googletest"
      - run: git clone --depth 1 --branch v4.2.4 https://github.com/simdjson/simdjson.git "$RUNNER_TEMP/simdjson"
      - run: uname -m | grep -x arm64
      - run: >
          cmake -S . -B build-clang -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_STANDARD=23
          -DMUSTACHE_REQUIRE_SIMDJSON=ON
          "-DCMAKE_CXX_FLAGS=-O2 -Wall -Wextra -Werror"
      - run: cmake --build build-clang
      - run: ctest --test-dir build-clang --output-on-failure
      - run: >
          cmake -S . -B build-gxx -G Ninja
          -DCMAKE_CXX_COMPILER="$CXX"
          -DCMAKE_C_COMPILER="$CC"
          -DCMAKE_CXX_STANDARD=26
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_simdjson=ON
          -DMUSTACHE_GOOGLETEST_SOURCE_DIR="$RUNNER_TEMP/googletest"
          -DMUSTACHE_SIMDJSON_SOURCE_DIR="$RUNNER_TEMP/simdjson"
          "-DCMAKE_CXX_FLAGS=-freflection -O2 -Wall -Wextra -Werror"
      - run: cmake --build build-gxx
      - run: ctest --test-dir build-gxx --output-on-failure
