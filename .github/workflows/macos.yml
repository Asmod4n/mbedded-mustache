name: macos

on:
  push:
    paths:
      - "include/**"
      - "test/**"
      - "CMakeLists.txt"
      - "refs/mustache-spec/*.json"
      - ".github/workflows/macos.yml"
      - "!test/arm_none_eabi.cpp"
      - "!include/mustache/reflect.hpp"
      - "!test/reflect.cpp"
  pull_request:
    paths:
      - "include/**"
      - "test/**"
      - "CMakeLists.txt"
      - "refs/mustache-spec/*.json"
      - ".github/workflows/macos.yml"
      - "!test/arm_none_eabi.cpp"
      - "!include/mustache/reflect.hpp"
      - "!test/reflect.cpp"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: arm64 macOS Apple clang C++23
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - run: brew install cmake ninja googletest simdjson mandoc
      - uses: actions/checkout@v4
      - run: uname -m | grep -x arm64
      - run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_STANDARD=23
          -DMUSTACHE_REQUIRE_SIMDJSON=ON
          "-DCMAKE_CXX_FLAGS=-O2 -Wall -Wextra -Werror"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
