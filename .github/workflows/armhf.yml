name: armhf

on:
  push:
    paths:
      - "include/**"
      - "test/**"
      - "CMakeLists.txt"
      - ".github/armhf-checks.cpp"
      - ".github/workflows/armhf.yml"
      - "!include/mustache/reflect.hpp"
      - "!include/mustache/typed.hpp"
      - "!test/reflect.cpp"
      - "!test/typed.cpp"
      - "!test/troff_mandoc.cpp"
      - "!test/spec.cpp"
  pull_request:
    paths:
      - "include/**"
      - "test/**"
      - "CMakeLists.txt"
      - ".github/armhf-checks.cpp"
      - ".github/workflows/armhf.yml"
      - "!include/mustache/reflect.hpp"
      - "!include/mustache/typed.hpp"
      - "!test/reflect.cpp"
      - "!test/typed.cpp"
      - "!test/troff_mandoc.cpp"
      - "!test/spec.cpp"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: armhf g++ C++23 under qemu-arm, arm-none-eabi compile
    runs-on: ubuntu-24.04
    container: debian:sid
    timeout-minutes: 15
    steps:
      - run: >
          apt-get update && apt-get install -y --no-install-recommends
          ca-certificates git cmake ninja-build googletest qemu-user
          g++-16-arm-linux-gnueabihf gcc-16-arm-linux-gnueabihf
          gcc-arm-none-eabi libstdc++-arm-none-eabi picolibc-arm-none-eabi
      - uses: actions/checkout@v4
      - run: arm-linux-gnueabihf-g++-16 -std=c++23 -O2 -Wall -Wextra -Werror -fsyntax-only .github/armhf-checks.cpp
      - run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=arm
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc-16
          -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++-16
          "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm;-L;/usr/arm-linux-gnueabihf"
          -DCMAKE_CXX_STANDARD=23
          "-DCMAKE_CXX_FLAGS=-O2 -Wall -Wextra -Werror"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: >
          arm-none-eabi-g++ -std=c++23 -O2 -mcpu=cortex-m4 -mthumb --specs=picolibcpp.specs
          -Wall -Wextra -Werror -Iinclude -c test/arm_none_eabi.cpp -o build/arm_none_eabi.o
